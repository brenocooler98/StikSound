name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and build extension
        run: |
          npm run typecheck
          npm test
          npm run build --workspace=@stiksound/extension
      - name: Package Chrome extension zip
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION="${TAG#v}"
          mkdir -p release-assets
          (cd apps/extension/dist && zip -r "../../../release-assets/StikSound-${VERSION}-chrome-extension.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension-assets
          path: release-assets/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build --workspace=@stiksound/desktop
      - name: Build Tauri Windows installers and executable
        shell: pwsh
        run: |
          npx --workspace=@stiksound/desktop tauri build --bundles nsis,msi
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "${{ github.event.inputs.tag }}" }
          $ver = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "target/release/stiksound-desktop.exe" "release-assets/StikSound-${ver}-windows-x64.exe"
          Get-ChildItem "target/release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName "release-assets/StikSound-${ver}-windows-x64-setup.exe"
          }
          Get-ChildItem "target/release/bundle/msi/*.msi" | ForEach-Object {
            Copy-Item $_.FullName "release-assets/StikSound-${ver}-windows-x64.msi"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build --workspace=@stiksound/desktop
      - name: Build Tauri macOS Universal (.app & .dmg)
        shell: bash
        run: |
          npx --workspace=@stiksound/desktop tauri build --target universal-apple-darwin --bundles app,dmg
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION="${TAG#v}"
          mkdir -p release-assets
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "release-assets/StikSound-${VERSION}-macos-universal.dmg"
          (cd target/universal-apple-darwin/release/bundle/macos && zip -r "../../../../../release-assets/StikSound-${VERSION}-macos-universal.app.zip" StikSound.app)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets/*

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and build CLI bundle
        run: |
          npm ci
          npm run build --workspace=@stiksound/cli
      - name: Stage portable CLI runtime dependencies
        shell: bash
        run: |
          STAGE_DEPS="apps/cli/dist-release/prod_stage"
          mkdir -p "$STAGE_DEPS"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("apps/cli/package.json", "utf8"));
            const runtimeDeps = {};
            for (const name of ["@jsquash/webp", "@modelcontextprotocol/sdk", "zod"]) {
              runtimeDeps[name] = pkg.dependencies[name];
            }
            fs.writeFileSync("apps/cli/dist-release/prod_stage/package.json", JSON.stringify({
              name: "stiksound-cli-runtime",
              private: true,
              dependencies: runtimeDeps
            }, null, 2));
          '
          npm --prefix "$STAGE_DEPS" install --omit=dev --no-audit --no-fund
          mv "$STAGE_DEPS/node_modules" apps/cli/dist-release/prod_modules
          node apps/cli/build.mjs --pack-release
      - name: Package cross-platform CLI archive
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION="${TAG#v}"
          mkdir -p release-assets
          (cd apps/cli/dist-release && zip -r "../../../release-assets/StikSound-${VERSION}-cli.zip" stiksound-cli)
      - uses: actions/upload-artifact@v4
        with:
          name: cli-assets
          path: release-assets/*

  build-android:
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      version: ${{ startsWith(github.ref_name, 'v') && github.ref_name || github.event.inputs.tag }}

  publish-release:
    needs: [build-extension, build-windows, build-macos, build-cli, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref_name, 'v') && github.ref_name || github.event.inputs.tag }}
          name: StikSound ${{ startsWith(github.ref_name, 'v') && github.ref_name || github.event.inputs.tag }} — Windows, macOS, Android, Chrome Extension & CLI
          generate_release_notes: true
          body: |
            ## 🌐 Versión Web (sin instalación) y Descargas (100% local, sin FFmpeg)

            > **¿Prefieres no instalar nada?** Usa la versión web en **[silverfeit.github.io/StikSound](https://silverfeit.github.io/StikSound/)** (funciona en PC, Android y iPhone como PWA con audios descargados en tu dispositivo). Para pegar enlaces directos de **MyInstants** o exportar **WebM transparente**, descarga la app de escritorio o la extensión de Chrome abajo.

            | Plataforma | Archivo recomendado | Cómo usar |
            | --- | --- | --- |
            | **Windows 10/11 (64-bit)** | `StikSound-*-windows-x64.exe` *(portable)* o `*-setup.exe` *(instalador)* | Doble clic para abrir o instalar al instante. |
            | **macOS (Apple Silicon & Intel)** | `StikSound-*-macos-universal.dmg` o `.app.zip` | Arrastra `StikSound.app` a **Aplicaciones**. *(Si macOS muestra aviso de desarrollador no verificado: clic derecho → **Abrir**).* |
            | **Android 10+** | `StikSound-*-android.apk` | Abre el APK en el teléfono y permite instalar apps de esta fuente. Pega enlaces de MyInstants o de audio, y comparte directo a WhatsApp. |
            | **Google Chrome / Edge / Brave** | `StikSound-*-chrome-extension.zip` | Descomprime el ZIP, abre `chrome://extensions/`, activa **Modo de desarrollador** y pulsa **Cargar descomprimida** seleccionando la carpeta descomprimida. |

            ### Qué incluye esta versión
            - Soporte para stickers **PNG con transparencia**, **WebP**, **JPG** y **GIF animado** (en bucle con duración mínima de un ciclo y sincronizado con la vista previa).
            - Encuadre `1:1` automático desde el centro o moviendo el mouse encima **sin hacer clic**.
            - Selector directo de transparencia (**Transparente**, **Blanco**, **Negro** o **Color**).
            - Recorte de audio local (`MP3`/`WAV`/`OGG`/`M4A`) o enlace de **MyInstants** con selector **`5s | 10s`**.
            - Interfaz multilingüe en **9 idiomas** (`ES`, `EN`, `PT`, `FR`, `DE`, `IT`, `RU`, `ZH`, `AR`), diálogo *Acerca de y licencias* renovado y botón **`➔`** / **`⬇`** para previsualizar, copiar o descargar (`MP4`, `WebM`, `ZIP` o `WebP`).

            > **Compatibilidad actual con WhatsApp:** A día de hoy, subir el MP4 como sticker con sonido **solo funciona directamente desde Android con WhatsApp Beta** (*Stickers → Crear → elegir MP4 en galería*, sujeto a activación gradual de Meta por cuenta). **Hoy no funciona en WhatsApp PC (normal ni beta), WhatsApp Web ni iPhone (iOS).**

            ### CLI headless (asset aparte)

            Escritorio, extensión y web **no incluyen ni necesitan FFmpeg**. El CLI es otro archivo de este release y no entra en esos instaladores.

            | Archivo | Cómo usar |
            | --- | --- |
            | `StikSound-*-cli.zip` | Requiere **Node.js 22** y **FFmpeg** en el sistema. Descomprime y ejecuta `bin/stiksound` (macOS y Linux) o `bin\stiksound.cmd` (Windows). `stiksound mcp` arranca el servidor MCP. No modifica el núcleo de las apps gráficas. |

            ---

            <details>
            <summary><strong>🇺🇸 English — Release Guide & Downloads (Click to expand)</strong></summary>

            > **Prefer zero installation?** Use the Web App at **[silverfeit.github.io/StikSound](https://silverfeit.github.io/StikSound/)** (works on PC, Android & iPhone PWA with downloaded audio files). To paste direct **MyInstants** links or export **transparent WebM**, download the Desktop app or Chrome extension below.

            | Platform | Recommended file | How to use |
            | --- | --- | --- |
            | **Windows 10/11 (64-bit)** | `StikSound-*-windows-x64.exe` *(portable)* or `*-setup.exe` *(installer)* | Double-click to run or install immediately. |
            | **macOS (Apple Silicon & Intel)** | `StikSound-*-macos-universal.dmg` or `.app.zip` | Drag `StikSound.app` to **Applications**. *(If Gatekeeper warns about an unverified developer: right-click → **Open**).* |
            | **Android 10+** | `StikSound-*-android.apk` | Open the APK on your phone and allow installs from this source. Paste MyInstants or audio links and share straight to WhatsApp. |
            | **Google Chrome / Edge / Brave** | `StikSound-*-chrome-extension.zip` | Unzip the archive, open `chrome://extensions/`, enable **Developer mode**, and click **Load unpacked** on the extracted folder. |

            #### Highlights
            - Supports **PNG with alpha**, **WebP**, **JPG**, and **animated GIF** (looped, matching preview delays and per-frame keyframes).
            - Zero-click `1:1` crop framing, direct matte/transparency selector, and `5s | 10s` audio duration toggle.
            - **9 built-in UI languages** (`ES`, `EN`, `PT`, `FR`, `DE`, `IT`, `RU`, `ZH`, `AR`) and updated About & licenses dialog.

            > **WhatsApp compatibility today:** Uploading the MP4 as a sound sticker **only works directly on Android with WhatsApp Beta** (*Stickers → Create → pick MP4 from gallery*, subject to Meta's gradual per-account rollout). **It does not currently work on WhatsApp PC (stable or beta), WhatsApp Web, or iPhone (iOS).**

            #### Headless CLI (separate asset)

            Desktop, extension, and web **do not bundle or require FFmpeg**. The CLI is a separate file in this release and is not inside those installers.

            | File | How to use |
            | --- | --- |
            | `StikSound-*-cli.zip` | Requires **Node.js 22** and **FFmpeg** on the machine. Unzip and run `bin/stiksound` (macOS and Linux) or `bin\stiksound.cmd` (Windows). `stiksound mcp` starts the MCP server. It does not change the GUI apps. |

            </details>

            <details>
            <summary><strong>🇧🇷 Português — Guia de Lançamento e Downloads (Clique para expandir)</strong></summary>

            > **Prefere não instalar nada?** Use a versão web em **[silverfeit.github.io/StikSound](https://silverfeit.github.io/StikSound/)** (funciona no PC, Android e iPhone como PWA com áudios baixados). Para colar links diretos do **MyInstants** ou exportar **WebM transparente**, baixe o app de desktop ou a extensão do Chrome abaixo.

            | Plataforma | Arquivo recomendado | Como usar |
            | --- | --- | --- |
            | **Windows 10/11 (64-bit)** | `StikSound-*-windows-x64.exe` *(portátil)* ou `*-setup.exe` *(instalador)* | Clique duas vezes para abrir ou instalar. |
            | **macOS (Apple Silicon & Intel)** | `StikSound-*-macos-universal.dmg` ou `.app.zip` | Arraste `StikSound.app` para **Aplicativos**. *(Se aparecer aviso de desenvolvedor não verificado: clique com o botão direito → **Abrir**).* |
            | **Android 10+** | `StikSound-*-android.apk` | Abra o APK no celular e permita instalar desta fonte. Cole links do MyInstants ou de áudio e compartilhe direto no WhatsApp. |
            | **Google Chrome / Edge / Brave** | `StikSound-*-chrome-extension.zip` | Extraia o ZIP, abra `chrome://extensions/`, ative o **Modo do desenvolvedor** e clique em **Carregar sem compactação**. |

            #### Novidades incluídas
            - Suporte para **PNG com transparência**, **WebP**, **JPG** e **GIF animado** (em loop sincronizado com a prévia).
            - Enquadramento `1:1` sem clique, seletor direto de fundo/transparência e botão de duração **`5s | 10s`**.
            - **9 idiomas na interface** (`ES`, `EN`, `PT`, `FR`, `DE`, `IT`, `RU`, `ZH`, `AR`) e janela Sobre e licenças atualizada.

            > **Compatibilidade atual no WhatsApp:** Enviar o MP4 como figurinha com som **só funciona diretamente no Android com WhatsApp Beta** (*Figurinhas → Criar → escolher MP4 na galeria*, sujeito à liberação gradual da Meta por conta). **Hoje não funciona no WhatsApp PC (normal ou beta), WhatsApp Web nem iPhone (iOS).**

            #### CLI headless (arquivo separado)

            Desktop, extensão e web **não incluem nem exigem FFmpeg**. O CLI é outro arquivo deste release e não entra nesses instaladores.

            | Arquivo | Como usar |
            | --- | --- |
            | `StikSound-*-cli.zip` | Exige **Node.js 22** e **FFmpeg** na máquina. Extraia e execute `bin/stiksound` (macOS e Linux) ou `bin\stiksound.cmd` (Windows). `stiksound mcp` inicia o servidor MCP. Não altera os apps gráficos. |

            </details>
          files: artifacts/*
